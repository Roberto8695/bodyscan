
services:
  postgres:
    image: postgres:17
    container_name: bodyscan-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: bodyscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bodyscan_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bodyscan -d bodyscan_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
